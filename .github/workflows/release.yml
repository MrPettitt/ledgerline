name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test --configuration Release
      - name: Publish self-contained Windows build
        run: >
          dotnet publish src/Ledgerline.Web
          --configuration Release
          --runtime win-x64
          --self-contained
          -p:Version=${GITHUB_REF_NAME#v}
          --output publish/ledgerline
      - name: Zip
        run: cd publish && zip -r "../ledgerline-${GITHUB_REF_NAME}-win-x64.zip" ledgerline
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "ledgerline-${GITHUB_REF_NAME}-win-x64.zip" --title "$GITHUB_REF_NAME" --generate-notes
